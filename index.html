<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken Video Player</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: black;
            height: 100vh;
        }

        .container {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            margin: 0 auto;
            filter: contrast(1.5) saturate(1.3) brightness(1.1);
        }

        .video {
            width: 320px;
            height: 320px;
            transform-origin: center;
            border: none;
            transition: transform 0.3s ease, transform-origin 0.3s ease;
        }

        .portrait {
            transform: scale(3.17);
        }

        .landscape {
            transform: scale(1.78);
        }

        .config-controls {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }

        .config-controls input[type="text"] {
            width: 300px;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }

        .config-controls button {
            padding: 8px 16px;
            background-color: #0078D4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .config-controls button:hover {
            background-color: #005ea2;
        }
    </style>
</head>

<body>
    <div class="container">
        <iframe 
            id="video" 
            class="video"
            src=""
            allow="autoplay; fullscreen"
            frameBorder="0"
            allowfullscreen>
        </iframe>
    </div>

    <div class="config-controls">
        <h3>Enter Video URL:</h3>
        <input type="text" id="video-url" placeholder="Enter YouTube or Pornhub link">
        <br>
        <button id="apply-btn">Submit</button>
    </div>

    <script>
        const videoFrame = document.getElementById('video');
        const applyButton = document.getElementById('apply-btn');
        const videoUrlInput = document.getElementById('video-url');

        // On load, use cached video URL
        const cachedUrl = localStorage.getItem('videoUrl');
        if (cachedUrl) {
            videoFrame.src = cachedUrl;
        }

        applyButton.addEventListener('click', () => {
            const url = videoUrlInput.value.trim();
            const embedUrl = getEmbedUrl(url);
            if (embedUrl) {
                localStorage.setItem('videoUrl', embedUrl);
                videoFrame.src = embedUrl;
            } else {
                alert('Invalid video URL. Please enter a valid YouTube or Pornhub link.');
            }
        });

        function getEmbedUrl(url) {
            try {
                const youtubeMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);
                const pornhubMatch = url.match(/pornhub\.com\/view_video\.php\?viewkey=([^&]+)/);

                if (youtubeMatch) {
                    return `https://www.youtube.com/embed/${youtubeMatch[1]}?autoplay=1&loop=1&controls=0&mute=1`;
                }
                if (pornhubMatch) {
                    return `https://www.pornhub.com/embed/${pornhubMatch[1]}`;
                }
                return null;
            } catch {
                return null;
            }
        }
    </script>
</body>
</html>
