<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken Video Player</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: black;
            height: 100vh;
        }

        .container {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            margin: 0 auto;
            filter: contrast(1.5) saturate(1.3) brightness(1.1);
        }

        .video {
            width: 320px;
            height: 320px;
            transform-origin: center;
            border: none;
            transition: transform 0.3s ease, transform-origin 0.3s ease;
        }

        .portrait {
            transform: scale(3.17);
        }

        .landscape {
            transform: scale(1.78);
        }

        .config-controls {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }

        .config-controls input[type="text"] {
            width: 300px;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }

        .config-controls button {
            padding: 8px 16px;
            background-color: #0078D4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .config-controls button:hover {
            background-color: #005ea2;
        }
    </style>
</head>

<body>
    <div class="container">
        <iframe id="video" class="video" src="" allow="autoplay; fullscreen" frameBorder="0" allowfullscreen>
        </iframe>
    </div>

    <div class="config-controls">
        <h3>Enter Video URL:</h3>
        <input type="text" id="video-url" placeholder="e.g., https://www.youtube.com/watch?v=XXXXXX&list=YYYYY">
        <br>
        <button id="apply-btn">Submit</button>
    </div>

    <script>
        const videoFrame = document.getElementById('video');
        const applyButton = document.getElementById('apply-btn');
        const videoUrlInput = document.getElementById('video-url');

        // On load, use cached video URL
        const cachedUrl = localStorage.getItem('youtubeVideoUrl');
        if (cachedUrl) {
            videoFrame.src = cachedUrl;
        }

        function buildEmbedUrl(videoId, playlistId = null) {
            if (playlistId) {
                // Playlist URL construction
                return `https://www.youtube.com/embed/${videoId}?autoplay=1&playlist=${playlistId}&loop=1&controls=0&mute=1`;
            }
            // Single video URL construction
            return `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&controls=0&mute=1`;
        }


        // Extract videoId and playlistId from URL
        function extractVideoAndPlaylistId(url) {
            try {
                const urlParams = new URLSearchParams(new URL(url).search);
                return {
                    videoId: urlParams.get('v') || null,
                    playlistId: urlParams.get('list') || null,
                };
            } catch {
                return { videoId: null, playlistId: null };
            }
        }

        applyButton.addEventListener('click', () => {
            const url = videoUrlInput.value.trim();
            const { videoId, playlistId } = extractVideoAndPlaylistId(url);

            if (videoId) {
                const embedUrl = buildEmbedUrl(videoId, playlistId);
                localStorage.setItem('youtubeVideoUrl', embedUrl);
                videoFrame.src = embedUrl;
            } else {
                alert('Invalid YouTube URL. Please try again.');
            }
        });
    </script>
</body>

</html>
