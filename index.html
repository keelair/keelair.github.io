<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken Video Player</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: black;
            color: white;
            height: 100vh;
        }

        .container {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            margin: 0 auto;
            filter: contrast(1.5) saturate(1.3) brightness(1.1);
        }

        .video {
            width: 320px;
            height: 320px;
            transform-origin: center;
            border: none;
            transition: transform 0.3s ease, transform-origin 0.3s ease;
        }

        .portrait {
            transform: scale(3.17);
        }

        .landscape {
            transform: scale(1.78);
        }

        /* Configuration Controls */
        .config-controls {
            margin-top: 30px;
            text-align: center;
            width: 100%;
        }

        .config-controls input[type="text"] {
            width: 300px;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }

        .config-controls button {
            padding: 8px 16px;
            background-color: #0078D4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .config-controls button:hover {
            background-color: #005ea2;
        }
    </style>
</head>

<body>
    <div class="container">
        <iframe 
            id="video" 
            class="video"
            src=""
            allow="autoplay; fullscreen"
            frameBorder="0"
            allowfullscreen>
        </iframe>
    </div>

    <div class="config-controls">
        <h3>Enter Video URL:</h3>
        <input type="text" id="video-url" placeholder="Enter YouTube or Pornhub link">
        <br>
        <button id="apply-btn">Submit</button>
        
        <div class="toggle-container">
            <span class="toggle-label">View lower half of screen?</span>
            <label class="toggle-switch">
                <input type="checkbox" id="booty-toggle">
                <span class="slider"></span>
            </label>
        </div>
        
        <div class="toggle-container">
            <span class="toggle-label">Portrait Mode?</span>
            <label class="toggle-switch">
                <input type="checkbox" id="orientation-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        const videoFrame = document.getElementById('video');
        const applyButton = document.getElementById('apply-btn');
        const videoUrlInput = document.getElementById('video-url');
        const bootyToggle = document.getElementById('booty-toggle');
        const orientationToggle = document.getElementById('orientation-toggle');
        const isKraken = new URLSearchParams(window.location.search).get('kraken') === '1';

        // 🟣 Kraken Browser Mode
        if (isKraken) {
            document.getElementById('config-controls').classList.add('hidden');
            
            // Load cached URL on page load
            const cachedUrl = localStorage.getItem('videoUrl') || buildEmbedUrl('https://www.youtube.com/watch?v=F8kQ5TkHFus');
            videoFrame.src = cachedUrl;

            videoFrame.style.transformOrigin = localStorage.getItem('bootyToggle') === 'true' ? 'center 68%' : 'center';
            videoFrame.className = localStorage.getItem('orientationToggle') === 'true' ? 'video portrait' : 'video landscape';
        } else {
            applyButton.addEventListener('click', () => {
                const url = videoUrlInput.value.trim();
                const embedUrl = buildEmbedUrl(url);
                if (embedUrl) {
                    localStorage.setItem('videoUrl', embedUrl);
                    videoFrame.src = embedUrl;
                } else {
                    alert('Invalid video URL. Please enter a valid YouTube or Pornhub link.');
                }
            });

            bootyToggle.addEventListener('change', () => {
                videoFrame.style.transformOrigin = bootyToggle.checked ? 'center 68%' : 'center';
                localStorage.setItem('bootyToggle', bootyToggle.checked);
            });

            orientationToggle.addEventListener('change', () => {
                const isChecked = orientationToggle.checked;
                videoFrame.className = isChecked ? 'video portrait' : 'video landscape';
                localStorage.setItem('orientationToggle', isChecked);
            });
        }

        function buildEmbedUrl(url) {
            try {
                const youtubeMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);
                const pornhubMatch = url.match(/pornhub\.com\/view_video\.php\?viewkey=([^&]+)/);
                const pornhubPlaylistMatch = url.match(/pornhub\.com\/view_video\.php\?viewkey=([^&]+)&pkey=([^&]+)/);

                if (youtubeMatch) {
                    return `https://www.youtube.com/embed/${youtubeMatch[1]}?autoplay=1&playlist=${youtubeMatch[1]}&loop=1&controls=0&mute=1`;
                }
                if (pornhubPlaylistMatch) {
                    return `https://www.pornhub.com/embed/${pornhubPlaylistMatch[1]}?pkey=${pornhubPlaylistMatch[2]}`;
                }
                if (pornhubMatch) {
                    return `https://www.pornhub.com/embed/${pornhubMatch[1]}`;
                }
                return null;
            } catch {
                return null;
            }
        }
    </script>
</body>
</html>
